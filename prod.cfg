[buildout]
extends =
    backup.cfg
    base.cfg
    sources.cfg

allow-picked-versions = false

parts +=
    instance-debug

auto-checkout +=
    collective.anysurfer
    collective.autopublishing
    collective.autoscaling
    collective.behavior.talcondition
    collective.complexrecordsproxy
    collective.exportimport
    collective.faceted.map
    collective.fingerpointing
    collective.geotransform
    collective.instancebehavior
    collective.js.jqueryui
    collective.messagesviewlet
    collective.pivot
    collective.privacy
    collective.solr
    collective.themefragments
    collective.timedevents
    collective.upgrade
    collective.z3cform.select2
    eea.facetednavigation
    iaweb.privacy
    imio.gdpr
    imio.helpers
    imio.omnia.core
    imio.omnia.tinymce
    imio.prometheus
    imio.pyutils
    imio.smartweb.common
    imio.smartweb.core
    imio.smartweb.locales
    imio.smartweb.policy

[instance]
http-address = 8080
shared-blob = on
blob-storage = /data/blobstorage
zodb-cache-size = $(ZODB_CACHE_SIZE)
zeo-client-cache-size = $(ZEO_CLIENT_CACHE_SIZE)
event-log-level = INFO
eggs +=
    pylibmc
    psycopg2
    Relstorage[postgresql]

threads = 2
rel-storage =
    type postgresql
    dsn dbname='$(RELSTORAGE_DB)' user='$(RELSTORAGE_USER)' host='$(RELSTORAGE_HOSTNAME)' port='$(RELSTORAGE_PORT)' password='$(RELSTORAGE_PASSWORD)'
    shared-blob-dir true
    blob-dir /data/blobstorage
    cache-servers $(MEMCACHE_SERVER):11211
    cache-prefix $(PROJECT_ID)

[instance-debug]
<= instance
debug-mode = on
verbose-security = on
event-log-level = INFO
eggs =
    ${instance:eggs}
    ${debug-products:eggs}
zcml =
    ${instance:zcml}

event-log-custom =
    <logfile>
        path /data/log/${:_buildout_section_name_}.log
        level debug
    </logfile>
