[buildout]

allow-picked-versions = true
show-picked-versions = true

parts =
    instance
    omelette

auto-checkout +=
    plone.formwidget.geolocation

extensions =
    mr.developer

extends =
    https://dist.plone.org/release/6.2.2.1/versions.cfg
    https://dist.plone.org/release/6.2.2.1/versions-ecosystem.cfg
    https://dist.plone.org/release/6.2.2.1/versions-extra.cfg
    versions.cfg

find-links +=
    https://eggs.imio.be/find-links/common/
    https://eggs.imio.be/find-links/plusimio/

versions = versions

[instance]
recipe = plone.recipe.zope2instance
zodb-temporary-storage = off
user = admin:admin
environment-vars =
  zope_i18n_compile_mo_files true
  TZ Europe/Brussels
eggs =
    Plone
    horse-with-no-namespace
    collective.big.bang
    collective.exportimport
    imio.smartweb.policy
    collective.preventactions
    collective.upgrade
    plone.observability[opentelemetry,opentelemetry-io]
    Products.PloneHotfix20261110
zcml =
    imio.smartweb.policy
    collective.preventactions
    collective.upgrade
    plone.observability
initialization =
  import horse_with_no_namespace
  # ofs (required by plone.observability) pulls in the ancient PyPI
  # 'argparse' backport package, which shadows the Python 3.9+ stdlib
  # argparse module (missing BooleanOptionalAction) since its egg path
  # is inserted before stdlib on sys.path. Strip it back out.
  sys.path = [p for p in sys.path if "/argparse-" not in p]
# plone.observability WSGI filters, wired into the pipeline (PasteDeploy resolves
# the inline egg: filters). healthserver starts the health-probe server on a
# separate port (PLONE_OBSERVABILITY_HEALTH_PORT, default 8081) in a background
# thread; observability populates request metrics for the @@metrics endpoint;
# opentelemetry emits the root span of each request (inert until
# OTEL_EXPORTER_OTLP_ENDPOINT is set). The opentelemetry-io extra adds outbound
# HTTP (requests/urllib3/httpx) child spans, only when
# PLONE_OBSERVABILITY_OTEL_INSTRUMENTORS=1.
pipeline =
    egg:plone.observability#healthserver
    egg:plone.observability#observability
    egg:plone.observability#opentelemetry
    translogger
    egg:Zope#httpexceptions
    zope

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[debug-products]
eggs =
    ipdb
    Products.PDBDebugMode
