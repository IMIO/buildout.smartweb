[buildout]
extends =
    base.cfg
    sources.cfg

extensions =
    mr.developer

parts +=
    zopepy
    zodbconvert

auto-checkout +=
    collective.exportimport
    collective.fingerpointing
    collective.geotransform
    collective.instancebehavior
    collective.js.jqueryui
    collective.messagesviewlet
    collective.pivot
    collective.preventactions
    collective.privacy
    collective.solr
    collective.timedevents
    collective.upgrade
    collective.z3cform.select2
    imio.pyutils
    imio.smartweb.common
    imio.smartweb.core
    imio.smartweb.locales
    imio.smartweb.policy
    pas.plugins.kimug

[instance]
debug-mode = on
verbose-security = on
user = admin:admin
# eggs +=
#     ${debug-products:eggs}
resources = ${buildout:directory}/resources
zcml-additional =
 <configure xmlns:solr="http://namespaces.plone.org/solr">
   <solr:connection host="localhost" port="8983" base="/solr/web"/>
 </configure>
environment-vars +=
  COLLECTIVE_SOLR_HOST localhost
  COLLECTIVE_SOLR_PORT 8983
  COLLECTIVE_SOLR_BASE /solr/web
  COLLECTIVE_SOLR_LOGIN solr
  COLLECTIVE_SOLR_PASSWORD SolrRocks

[zopepy]
recipe = zc.recipe.egg
eggs =
    ${instance:eggs}
    RelStorage
    psycopg2-binary
interpreter = zopepy
scripts = zodbconvert

[zodbconvert]
recipe = zc.recipe.egg
eggs = ${zopepy:eggs}
scripts = zodbconvert
