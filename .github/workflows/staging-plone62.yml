name: Publish and deploy plone62 staging image
on:
  push:
    branches:
      - plone62
    tags:
      - '!**'
  workflow_dispatch:
env:
  REGISTRY_URL: ${{ secrets.HARBOR_URL }}

permissions:
  contents: read
  security-events: write

# The image is built and pushed once, as :<short sha>. The test job tests that image,
# then promote adds the :plone62 tags: a failing image is never tagged :plone62 nor deployed.
jobs:
  build-push:
    runs-on: gha-runners-smartweb
    if: contains(github.event.head_commit.message, 'Back to development:') == false && contains(github.event.head_commit.message, 'Preparing release') == false
    outputs:
      short_sha: ${{ steps.tags.outputs.short_sha }}
    steps:
      - name: Build tags
        id: tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAGS=${{ env.REGISTRY_URL }}/${{ vars.IMAGE_NAME }}:$SHORT_SHA" >> "$GITHUB_ENV"
      - name: Build push and notify
        uses: IMIO/gha/build-push-notify@v7
        with:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAGS: ${{ env.IMAGE_TAGS }}
          REGISTRY_URL: ${{ env.REGISTRY_URL}}
          REGISTRY_USERNAME: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
  test:
    needs: build-push
    uses: ./.github/workflows/tests.yml
    with:
      image_name: ${{ vars.IMAGE_NAME }}
      image_tag: ${{ needs.build-push.outputs.short_sha }}
    secrets: inherit
  trivy-image:
    name: Image scan
    runs-on: gha-runners-smartweb
    needs: build-push
    steps:
      - uses: IMIO/gha/trivy-scan-notify@v7
        with:
          SCAN_TYPE: image
          IMAGE_REF: ${{ secrets.HARBOR_URL }}/${{ vars.IMAGE_NAME }}:${{ needs.build-push.outputs.short_sha }}
          EXIT_CODE: '0'
          TRIVYIGNORES: ''
          TRIVY_USERNAME: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
          UPLOAD_SARIF: 'true'
          IGNORE_UNFIXED: 'false'
  trivy-fs:
    name: Filesystem scan
    runs-on: gha-runners-smartweb
    steps:
      - uses: IMIO/gha/trivy-scan-notify@v7
        with:
          SCAN_TYPE: fs
          SCAN_REF: .
          EXIT_CODE: '0'
          TRIVYIGNORES: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
          UPLOAD_SARIF: 'true'
          IGNORE_UNFIXED: 'false'
  promote:
    runs-on: gha-runners-smartweb
    needs: [build-push, test]
    steps:
      - name: Tag and notify
        uses: IMIO/gha/tag-notify@v8
        with:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-push.outputs.short_sha }}
          NEW_IMAGE_TAGS: |
            plone62
            plone62-${{ github.run_number }}
          REGISTRY_URL: ${{ env.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
          MATTERMOST_WEBHOOK_URL: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
  deploy-on-k8s:
    needs: [promote, trivy-image, trivy-fs]
    environment: staging
    runs-on: gha-runners-smartweb
    steps:
      - name: Build short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Update Kubernetes tag
        uses: IMIO/gha/k8s-update-tag@v5
        with:
          TAG: ${{ env.SHORT_SHA }}
          REPO_TOKEN_NAME: ${{ secrets.SMARTWEB_ARGOCD_TOKEN_NAME }}
          REPO_ACCESS_TOKEN: ${{ secrets.SMARTWEB_ARGOCD_ACCESS_TOKEN }}
          REPO_URL: ${{ secrets.SMARTWEB_ARGOCD_REPO_URL }}
          TARGET_BRANCH: main
          VALUES_FILE_PATH: staging/common/values.yaml
