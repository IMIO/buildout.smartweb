name: Test image
on:
  pull_request:
  workflow_call:
    inputs:
      image_name:
        description: 'Image to test instead of building it, relative to the registry. Empty to build it'
        type: string
        required: false
        default: ''
      image_tag:
        description: 'Tag of image_name'
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: IMIO/gha-workflows/.github/workflows/plone-image-test.yml@v1
    with:
      addons: imio.smartweb.policy
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      log_allowlist: tests/log_allowlist.txt
      runner_label: gha-runners-smartweb
    secrets:
      mattermost_webhook_url: ${{ secrets.SMARTWEB_MATTERMOST_WEBHOOK_URL }}
      registry_url: ${{ secrets.HARBOR_URL }}
      registry_username: ${{ secrets.SMARTWEB_HARBOR_USERNAME }}
      registry_password: ${{ secrets.SMARTWEB_HARBOR_PASSWORD }}
